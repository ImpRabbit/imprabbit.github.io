<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0c"/>
<link rel="manifest" href="../manifest.webmanifest"/>
<link rel="apple-touch-icon" href="../images/icon.svg"/>
<title>ポーンの構造 | 三大将チェス</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.lesson-layout{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);max-width:640px;margin:0 auto}
.teacher-bar{display:flex;align-items:center;gap:var(--space-md);width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md)}
.teacher-bar .character-portrait{width:52px;height:68px;font-size:.7rem;border-color:var(--blue)}
.teacher-name{font-weight:500;color:var(--blue)}
.dialogue-box{width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);min-height:4.5em;line-height:1.6}
.dialogue-box.correct{border-color:var(--gold)}.dialogue-box.wrong{border-color:var(--red)}
.step-indicator{font-size:.85rem;color:var(--text-muted);text-align:center}
.lesson-controls{display:flex;gap:var(--space-sm);justify-content:center}
.back-link{align-self:flex-start;margin-bottom:var(--space-md);font-size:.9rem;color:var(--text-secondary)}
.hint{font-size:.85rem;color:var(--text-muted);text-align:center}
</style></head>
<body><div class="page"><div class="container">
<a href="../lessons.html" class="back-link">← レッスン一覧に戻る</a>
<div class="lesson-layout">
<div class="teacher-bar"><div class="character-portrait" data-character="kuzan"><span>クザ</span></div>
<div><div class="teacher-name">クザン</div><div style="font-size:.8rem;color:var(--text-muted)">中級・ポーン</div></div></div>
<div class="dialogue-box" id="dialogue">読み込み中…</div>
<div class="step-indicator" id="step-indicator">1 / 1</div>
<div class="hint" id="hint"></div>
<div class="board-wrapper"><div id="board"></div></div>
<div class="lesson-controls"><button class="btn" id="btn-prev">前へ</button><button class="btn btn-gold" id="btn-next">次へ</button></div>
</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="../js/chess-board.js"></script>
<script src="../js/lesson-extras.js"></script>
<script src="../js/progress.js"></script>
<script>
const lessonData={id:"12-pawn-structure",steps:[
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"ポーンは戻れない。むやみに突くと穴と孤立が生まれる。突く前に理由を持て。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"中央のポーン（e4・d4）は意味がある。端のポーンを早く突くより、中央と展開を優先しろ。"},
{type:"explain",fen:"8/8/8/8/3P4/8/8/8 w - - 0 1",highlight:["d4"],text:"孤立したポーンは守りにくく狙われやすい。隣に味方ポーンがない状態だ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"穴（アウトポスト）は、相手がポーンで追い出せないマスだ。自分のナイトを置くと強くなる。"},
{type:"practice",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",highlight:["e2","d2"],text:"【問題1】意味のある前進（中央）を選べ。",correct:["e2e4","d2d4"],correctText:"正解だ。中央は健全だ。",wrongText:"e4かd4を。"},
{type:"practice",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2",highlight:["g1"],text:"【問題2】展開の一手を（ナイトf3）。",correct:["g1f3"],correctText:"正解だ。ポーンを突くより先に駒を出せる局面も多い。",wrongText:"ナイトをf3へ。"},
{type:"practice",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",highlight:["e2"],text:"【問題3】eポーンを2マス進めろ。",correct:["e2e4"],correctText:"正解だ。",wrongText:"e2からe4へ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"ポーンを突く理由の例：中央を取る、駒の出路を開く、相手の駒を追い払う。理由がなければ待つ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"対局でポーンを突く前に、『このポーンは後で弱点にならないか』を一度考えろ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"中級はここまでだ。初級の基礎＋中級の失敗・戦術・終盤・詰み・中盤・ポーンを、対局で繰り返せ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"三大将との対局で、学んだことを試せ。負けても対局後のヒントから次のレッスンに戻れる。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"要点：戻れない、中央は意味がある、無駄に突くな。これで中級は一通り終了だ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"お疲れ。あとは実戦量だ。対局画面から、好きな相手と強さで続けてくれ。"}
]};
const dialogueEl=document.getElementById("dialogue"),stepEl=document.getElementById("step-indicator"),hintEl=document.getElementById("hint"),btnPrev=document.getElementById("btn-prev"),btnNext=document.getElementById("btn-next");
let currentStep=0,practiceSolved=false;
const board=window.__lessonBoard=new ChessBoardUI("board",{onMove:onBoardMove});
function loadStep(i){currentStep=i;practiceSolved=false;const s=lessonData.steps[i];board.loadFen(s.fen);board.clearHighlights();if(s.highlight)s.highlight.forEach(sq=>{const el=board.container.querySelector(`[data-square="${sq}"]`);if(el)el.classList.add("highlight");});dialogueEl.textContent=s.text;dialogueEl.classList.remove("correct","wrong");stepEl.textContent=(i+1)+" / "+lessonData.steps.length;if(s.type==="practice"){hintEl.textContent="駒を動かして正解を";btnNext.disabled=true;btnNext.textContent="正解後に次へ";}else{hintEl.textContent="";btnNext.disabled=false;btnNext.textContent=i>=lessonData.steps.length-1?"完了":"次へ";}btnPrev.disabled=i<=0;}
function onBoardMove(move){const s=lessonData.steps[currentStep];if(s.type!=="practice"||practiceSolved)return;const uci=move.from+move.to+(move.promotion||"");if((s.correct||[]).includes(uci)||(s.correct||[]).includes(move.from+move.to)){practiceSolved=true;dialogueEl.textContent=s.correctText||"正解だ。";dialogueEl.classList.add("correct");btnNext.disabled=false;btnNext.textContent=currentStep>=lessonData.steps.length-1?"完了":"次へ";}else{dialogueEl.textContent=s.wrongText||"違うぞ。";dialogueEl.classList.add("wrong");setTimeout(()=>board.undo(),600);}}
btnPrev.onclick=()=>{if(currentStep>0){loadStep(currentStep-1);Progress.setLessonStep("12-pawn-structure",currentStep);}};
btnNext.onclick=()=>{if(currentStep>=lessonData.steps.length-1){Progress.completeLesson("12-pawn-structure");alert("「ポーンの構造」を終えました。中級は一通り終了です。");location.href="../lessons.html";return;}loadStep(currentStep+1);Progress.setLessonStep("12-pawn-structure",currentStep);};
loadStep(0);
</script></body></html>
