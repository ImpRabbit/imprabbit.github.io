<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="../css/style.css"/><title>中盤の考え方</title><style>.lesson-layout{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);max-width:640px;margin:0 auto}.teacher-bar{display:flex;align-items:center;gap:var(--space-md);width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:8px 16px}.dialogue-box{width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:8px;padding:16px;min-height:4em}.dialogue-box.correct{border-color:var(--gold)}.dialogue-box.wrong{border-color:var(--red)}.lesson-controls{display:flex;gap:8px;justify-content:center}.back-link{align-self:flex-start;color:var(--text-secondary);font-size:.9rem}</style></head><body><div class="page"><div class="container"><a href="../lessons.html" class="back-link">← レッスン一覧</a><div class="lesson-layout"><div class="teacher-bar"><div class="character-portrait" data-character="kuzan" style="width:52px;height:68px;border-color:var(--blue)"><span>クザ</span></div><div><div style="color:var(--blue);font-weight:500">クザン</div><div style="font-size:.8rem;color:var(--text-muted)">中級 ― 中盤</div></div></div><div class="dialogue-box" id="dialogue">...</div><div id="step-indicator" style="color:var(--text-muted);font-size:.85rem">1/1</div><div class="board-wrapper"><div id="board"></div></div><div class="lesson-controls"><button class="btn" id="btn-prev">前へ</button><button class="btn btn-gold" id="btn-next">次へ</button></div></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="../js/chess-board.js"></script><script src="../js/progress.js"></script><script src="../js/lesson-extras.js"></script><script>
const lessonData={id:"11-middlegame",steps:[{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"中盤は①脅威②安全③改善できる駒の順で見ろ。"},{type:"practice",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2",highlight:["g1"],text:"【問題】ナイトを展開しろ。",correct:["g1f3"],correctText:"正解だ。",wrongText:"f3へ。"},{type:"practice",fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2",highlight:["b1"],text:"【問題】もう一方のナイトも。",correct:["b1c3"],correctText:"正解だ。",wrongText:"c3へ。"}]};
const dialogueEl=document.getElementById("dialogue"),stepEl=document.getElementById("step-indicator"),btnPrev=document.getElementById("btn-prev"),btnNext=document.getElementById("btn-next");let currentStep=0,practiceSolved=false;const board=window.__lessonBoard=new ChessBoardUI("board",{onMove:onBoardMove});
function loadStep(i){currentStep=i;practiceSolved=false;const s=lessonData.steps[i];board.loadFen(s.fen);board.clearHighlights();if(s.highlight)s.highlight.forEach(sq=>{const el=board.container.querySelector(`[data-square="${sq}"]`);if(el)el.classList.add("highlight");});dialogueEl.textContent=s.text;dialogueEl.classList.remove("correct","wrong");stepEl.textContent=(i+1)+" / "+lessonData.steps.length;if(s.type==="practice"){btnNext.disabled=true;btnNext.textContent="正解後に次へ";}else{btnNext.disabled=false;btnNext.textContent=i>=lessonData.steps.length-1?"完了":"次へ";}btnPrev.disabled=i<=0;}
function onBoardMove(move){const s=lessonData.steps[currentStep];if(s.type!=="practice"||practiceSolved)return;const uci=move.from+move.to;if((s.correct||[]).includes(uci)){practiceSolved=true;dialogueEl.textContent=s.correctText;dialogueEl.classList.add("correct");btnNext.disabled=false;btnNext.textContent=currentStep>=lessonData.steps.length-1?"完了":"次へ";}else{dialogueEl.textContent=s.wrongText;dialogueEl.classList.add("wrong");setTimeout(()=>board.undo(),600);}}
btnPrev.onclick=()=>{if(currentStep>0){loadStep(currentStep-1);Progress.setLessonStep("11-middlegame",currentStep);}};
btnNext.onclick=()=>{if(currentStep>=lessonData.steps.length-1){Progress.completeLesson("11-middlegame");alert("「中盤の考え方入門」を終えました。");location.href="../lessons.html";return;}loadStep(currentStep+1);Progress.setLessonStep("11-middlegame",currentStep);};
loadStep(0);
</script></body></html>
