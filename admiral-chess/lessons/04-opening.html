<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0c"/>
<link rel="manifest" href="../manifest.webmanifest"/>
<link rel="apple-touch-icon" href="../images/icon.svg"/>
<title>オープニング入門 | 三大将チェス</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>.lesson-layout{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);max-width:640px;margin:0 auto}.teacher-bar{display:flex;align-items:center;gap:var(--space-md);width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md)}.teacher-bar .character-portrait{width:52px;height:68px;font-size:.7rem;border-color:var(--blue)}.teacher-name{font-weight:500;color:var(--blue)}.dialogue-box{width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);min-height:4.5em;line-height:1.6}.dialogue-box.correct{border-color:var(--gold)}.dialogue-box.wrong{border-color:var(--red)}.step-indicator{font-size:.85rem;color:var(--text-muted);text-align:center}.lesson-controls{display:flex;gap:var(--space-sm);justify-content:center}.back-link{align-self:flex-start;margin-bottom:var(--space-md);font-size:.9rem;color:var(--text-secondary)}.hint{font-size:.85rem;color:var(--text-muted);text-align:center}</style>
</head>
<body>
<div class="page"><div class="container">
<a href="../lessons.html" class="back-link">← レッスン一覧に戻る</a>
<div class="lesson-layout">
<div class="teacher-bar"><div class="character-portrait" data-character="kuzan"><span>クザ</span></div><div><div class="teacher-name">クザン</div><div style="font-size:.8rem;color:var(--text-muted)">オープニング担当</div></div></div>
<div class="dialogue-box" id="dialogue">読み込み中…</div>
<div class="step-indicator" id="step-indicator">1 / 1</div>
<div class="hint" id="hint"></div>
<div class="board-wrapper"><div id="board"></div></div>
<div class="lesson-controls"><button class="btn" id="btn-prev">前へ</button><button class="btn btn-gold" id="btn-next">次へ</button></div>
</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="../js/chess-board.js"></script>
<script src="../js/lesson-extras.js"></script>
<script src="../js/progress.js"></script>
<script>
const lessonData = {
  id: "04-opening",
  steps: [
    { type:"explain", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
      text:"オープニングの原則は3つだ。①中央を取る ②駒を展開する ③キングを安全にする。この順で意識しろ。" },
    { type:"explain", fen:"rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1", highlight:["e4"],
      text:"e4やd4は中央を取る典型的な一手だ。ポーンで中央を抑え、後ろの駒が出やすくなる。" },
    { type:"explain", fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2", highlight:["f3"],
      text:"次にナイトを出す。g1のナイトはf3へ、b1のナイトはc3へ。まだ出ていない駒を優先して展開する。" },
    { type:"explain", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
      text:"クイーンを早く出すのは初心者の失敗だ。小駒（ナイト・ビショップ）とポーンで中央を固めてからでいい。" },
    { type:"practice", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", highlight:["e2","d2"],
      text:"【問題1】中央を意識した一手を指せ。",
      correct:["e2e4","d2d4"],
      correctText:"正解だ。中央のポーンを進めるのは健全な一手だ。",
      wrongText:"e4かd4を選べ。" },
    { type:"practice", fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2", highlight:["g1"],
      text:"【問題2】ナイトを展開しろ（f3へ）。",
      correct:["g1f3"],
      correctText:"正解だ。まだ出ていない駒を働かせる。",
      wrongText:"g1のナイトをf3へ。" },
    { type:"explain", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
      text:"キングの安全も忘れんな。キャスリング（キングとルークの特殊な手）で端に逃がすのが基本だ。次のレッスンで終盤もやる。" },
    { type:"explain", fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",
      text:"要点：中央・展開・キングの安全。この3つを対局の最初から意識しろ。" }
  ]
};
const dialogueEl=document.getElementById("dialogue"),stepEl=document.getElementById("step-indicator"),hintEl=document.getElementById("hint"),btnPrev=document.getElementById("btn-prev"),btnNext=document.getElementById("btn-next");
let currentStep=0,practiceSolved=false;
const board=window.__lessonBoard=new ChessBoardUI("board",{onMove:onBoardMove});
function loadStep(i){currentStep=i;practiceSolved=false;const s=lessonData.steps[i];board.loadFen(s.fen);board.clearHighlights();if(s.highlight)s.highlight.forEach(sq=>{const el=board.container.querySelector(`[data-square="${sq}"]`);if(el)el.classList.add("highlight");});dialogueEl.textContent=s.text;dialogueEl.classList.remove("correct","wrong");stepEl.textContent=(i+1)+" / "+lessonData.steps.length;if(s.type==="practice"){hintEl.textContent="駒を動かして正解を";btnNext.disabled=true;btnNext.textContent="正解後に次へ";}else{hintEl.textContent="";btnNext.disabled=false;btnNext.textContent=i>=lessonData.steps.length-1?"完了":"次へ";}btnPrev.disabled=i<=0;}
function onBoardMove(move){const s=lessonData.steps[currentStep];if(s.type!=="practice"||practiceSolved)return;const uci=move.from+move.to+(move.promotion||"");if((s.correct||[]).includes(uci)||(s.correct||[]).includes(move.from+move.to)){practiceSolved=true;dialogueEl.textContent=s.correctText||"正解だ。";dialogueEl.classList.add("correct");btnNext.disabled=false;btnNext.textContent=currentStep>=lessonData.steps.length-1?"完了":"次へ";}else{dialogueEl.textContent=s.wrongText||"違うぞ。";dialogueEl.classList.add("wrong");setTimeout(()=>board.undo(),600);}}
btnPrev.onclick=()=>{if(currentStep>0){loadStep(currentStep-1);Progress.setLessonStep("04-opening",currentStep);}};
btnNext.onclick=()=>{if(currentStep>=lessonData.steps.length-1){Progress.completeLesson("04-opening");alert("「オープニング入門」を終えました。");location.href="../lessons.html";return;}loadStep(currentStep+1);Progress.setLessonStep("04-opening",currentStep);};
loadStep(0);
</script>
</body></html>
