<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0c"/>
<link rel="manifest" href="../manifest.webmanifest"/>
<link rel="apple-touch-icon" href="../images/icon.svg"/>
<title>詰みパターン | 三大将チェス</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
.lesson-layout{display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);max-width:640px;margin:0 auto}
.teacher-bar{display:flex;align-items:center;gap:var(--space-md);width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md)}
.teacher-bar .character-portrait{width:52px;height:68px;font-size:.7rem;border-color:var(--red)}
.teacher-name{font-weight:500;color:var(--red)}
.dialogue-box{width:100%;background:var(--bg-card);border:1px solid #2a2a2a;border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);min-height:4.5em;line-height:1.6}
.dialogue-box.correct{border-color:var(--gold)}.dialogue-box.wrong{border-color:var(--red)}
.step-indicator{font-size:.85rem;color:var(--text-muted);text-align:center}
.lesson-controls{display:flex;gap:var(--space-sm);justify-content:center}
.back-link{align-self:flex-start;margin-bottom:var(--space-md);font-size:.9rem;color:var(--text-secondary)}
.hint{font-size:.85rem;color:var(--text-muted);text-align:center}
</style></head>
<body><div class="page"><div class="container">
<a href="../lessons.html" class="back-link">← レッスン一覧に戻る</a>
<div class="lesson-layout">
<div class="teacher-bar"><div class="character-portrait" data-character="sakazuki"><span>サカ</span></div>
<div><div class="teacher-name">サカズキ</div><div style="font-size:.8rem;color:var(--text-muted)">中級・詰み</div></div></div>
<div class="dialogue-box" id="dialogue">読み込み中…</div>
<div class="step-indicator" id="step-indicator">1 / 1</div>
<div class="hint" id="hint"></div>
<div class="board-wrapper"><div id="board"></div></div>
<div class="lesson-controls"><button class="btn" id="btn-prev">前へ</button><button class="btn btn-gold" id="btn-next">次へ</button></div>
</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="../js/chess-board.js"></script>
<script src="../js/lesson-extras.js"></script>
<script src="../js/progress.js"></script>
<script>
const lessonData={id:"10-mate-patterns",steps:[
{type:"explain",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",text:"よくある詰みパターンを叩き込む。バックランクメイトじゃ。最終段のキングがポーンに塞がれて詰む。"},
{type:"explain",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",highlight:["a1","g8"],text:"黒キングはg8、ポーンがf7・g7・h7で逃げ道がない。白ルークが8段目に入れば詰みだ。"},
{type:"explain",fen:"7k/5Q2/6K1/8/8/8/8/8 w - - 0 1",highlight:["f7","h8"],text:"クイーンの近接詰みもある。キングの隣や正面にクイーンを置き、逃げ道を消す。"},
{type:"practice",fen:"6k1/5ppp/8/8/8/8/8/1R4K1 w - - 0 1",highlight:["b1"],text:"【問題1】このルークで詰みを。",correct:["b1b8"],correctText:"正解じゃ。バックランクメイトだ。",wrongText:"ルークをb8へ。"},
{type:"practice",fen:"7k/5Q2/6K1/8/8/8/8/8 w - - 0 1",highlight:["f7"],text:"【問題2】クイーンで詰みを。",correct:["f7f8","f7g7","f7h7"],correctText:"正解じゃ。",wrongText:"クイーンで逃げられないチェックを。"},
{type:"practice",fen:"7k/8/6K1/8/8/8/8/7R w - - 0 1",highlight:["h1"],text:"【問題3】ルークでチェックを。",correct:["h1h8","h1h7","h1h6","h1h5","h1h4","h1h3","h1h2"],correctText:"正解じゃ。",wrongText:"h列に。"},
{type:"practice",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",highlight:["a1"],text:"【問題4】a列のルークでバックランクメイトを。",correct:["a1a8"],correctText:"正解じゃ。",wrongText:"a8へ。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"自分の最終段も守れ。ポーンを突いて逃げ道（フライトスクエア）を作る意識を持て。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"逃げ道を残す意識と、相手の逃げ道を消す意識。両方持て。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"パターンを覚えると、対局中に『詰みがある』と気づきやすくなる。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"次は中盤の考え方だ。詰みや戦術の前に、局面の見方を整理する。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"要点：バックランク、近接詰み、逃げ道の確保と封鎖。"},
{type:"explain",fen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",text:"詰みパターンは反復で体に入る。対局後に『詰めた／詰まされた形』を振り返れ。"}
]};
const dialogueEl=document.getElementById("dialogue"),stepEl=document.getElementById("step-indicator"),hintEl=document.getElementById("hint"),btnPrev=document.getElementById("btn-prev"),btnNext=document.getElementById("btn-next");
let currentStep=0,practiceSolved=false;
const board=window.__lessonBoard=new ChessBoardUI("board",{onMove:onBoardMove});
function loadStep(i){currentStep=i;practiceSolved=false;const s=lessonData.steps[i];board.loadFen(s.fen);board.clearHighlights();if(s.highlight)s.highlight.forEach(sq=>{const el=board.container.querySelector(`[data-square="${sq}"]`);if(el)el.classList.add("highlight");});dialogueEl.textContent=s.text;dialogueEl.classList.remove("correct","wrong");stepEl.textContent=(i+1)+" / "+lessonData.steps.length;if(s.type==="practice"){hintEl.textContent="駒を動かして正解を";btnNext.disabled=true;btnNext.textContent="正解後に次へ";}else{hintEl.textContent="";btnNext.disabled=false;btnNext.textContent=i>=lessonData.steps.length-1?"完了":"次へ";}btnPrev.disabled=i<=0;}
function onBoardMove(move){const s=lessonData.steps[currentStep];if(s.type!=="practice"||practiceSolved)return;const uci=move.from+move.to+(move.promotion||"");if((s.correct||[]).includes(uci)||(s.correct||[]).includes(move.from+move.to)){practiceSolved=true;dialogueEl.textContent=s.correctText||"正解じゃ。";dialogueEl.classList.add("correct");btnNext.disabled=false;btnNext.textContent=currentStep>=lessonData.steps.length-1?"完了":"次へ";}else{dialogueEl.textContent=s.wrongText||"違うぞ。";dialogueEl.classList.add("wrong");setTimeout(()=>board.undo(),600);}}
btnPrev.onclick=()=>{if(currentStep>0){loadStep(currentStep-1);Progress.setLessonStep("10-mate-patterns",currentStep);}};
btnNext.onclick=()=>{if(currentStep>=lessonData.steps.length-1){Progress.completeLesson("10-mate-patterns");alert("「よくある詰みパターン」を終えました。");location.href="../lessons.html";return;}loadStep(currentStep+1);Progress.setLessonStep("10-mate-patterns",currentStep);};
loadStep(0);
</script></body></html>
